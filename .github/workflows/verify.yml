name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate skills and public boundary
        run: ./bin/agent-kit doctor --strict
      - name: Validate UI/UX skill datasets
        run: python3 skills/ui-ux-pro-max/scripts/validate_data.py
