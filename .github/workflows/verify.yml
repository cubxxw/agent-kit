name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate skills and public boundary
        run: ./bin/agent-kit doctor --strict
      - name: Validate UI/UX skill datasets
        run: python3 skills/ui-ux-pro-max/scripts/validate_data.py
